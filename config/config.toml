# ═══════════════════════════════════════════════════════════════
# Yagent 配置文件
# 使用方式：复制到 ~/.yagent/config/config.toml 后修改
# 完整配置说明见 docs/config-guide.md
# ═══════════════════════════════════════════════════════════════

# ── 全局任务超时（根级字段）──
# task_timeout = "0s"    # 0 = 不启用，正数表示超时时间（如 "30m"）

# ── 全局 LLM ──
[global.llm]
use_provider = "aliyun"

# ── LLM 提供商 ──
[global.llm.providers.aliyun]
model = "qwen3-coder-plus"
temperature = 0.0
max_tokens = 28000
api_base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = "your-key"

# 故障转移配置示例（取消注释以启用）:
# 简写格式（按声明顺序尝试）:
# fallback_providers = ["deepseek_v4_pro", "local"]
# 完整格式（按权重排序，weight 越大越优先）:
# fallback_providers = [
#     { provider = "deepseek_v4_pro", weight = 10 },
#     { provider = "local", weight = 5 },
# ]

[global.llm.providers.deepseek_v4_pro]
model = "deepseek-v4-pro"
temperature = 0.0
max_tokens = 3000
api_base_url = "https://api.deepseek.com/v1"
api_key = "your-key"
reasoning_effort = "max"

[global.llm.providers.local]
model = "Qwen3-30B-A3B"
temperature = 0.0
max_tokens = 3000
api_base_url = "http://127.0.0.1:8000"
api_key = "dummy-key"

# ── Agent 级 LLM 覆盖（优先级: tool > tools > agent > agents > global）──
[agents.llm.director]
use_provider = "deepseek_v4_pro"

[agents.llm.coding]
use_provider = "local"

[agents.llm.repo]
use_provider = "local"

[agents.llm.browser]
use_provider = "local"

[agents.llm.chat]
use_provider = "local"

[agents.llm.meta]
use_provider = "local"

[agents.llm.devops]
use_provider = "local"

# ── 工具级 LLM 覆盖（优先级: tool > tools > agent > agents > global）──
[tools.llm.thinking]
use_provider = "deepseek_v4_pro"

[tools.llm.deepthinking]
use_provider = "deepseek_v4_pro"

# ── 应用设置 ──
[app]
enable_streaming = true

# ── Agent 行为配置 ──
[agent]
yolo_mode = false             # YOLO 模式：自动批准所有危险操作
full_yolo_mode = false        # 完全自治模式
director_max_steps = 100      # Director 最大步数
coding_max_steps = 150        # Coding Agent 最大步数
repo_max_steps = 50           # Repo Agent 最大步数
chat_max_steps = 50           # Chat Agent 最大步数
devops_max_steps = 50         # DevOps Agent 最大步数
browser_max_steps = 200       # Browser Agent 最大步数
meta_max_steps = 50           # Meta Agent 最大步数
meta_retry_count = 5          # Meta Agent 重试次数
lang = ""                     # 对话语言（空=默认）

# ── LLM 推理兜底配置 ──
[llm]
timeout = "5m"                       # 单次 LLM 调用超时
max_retries = 5                      # 底层引擎重试次数
step_retries = 0                     # 步骤重试次数
circuit_breaker_threshold = 0        # 熔断阈值（0=不启用）
circuit_breaker_reset_timeout = "0s" # 熔断恢复时间
enable_fallback = false              # 启用 provider 级故障转移
fallback_max_retries = 2             # fallback provider 内部重试次数

# ── CodeSeek MCP 代码分析引擎配置 ──
[codeseek]
binary_path = ""                     # codeseek 二进制路径（空=不启用 MCP）
mcp_args = ["serve", "--mcp"]        # MCP 启动参数
request_timeout = 30                 # 请求超时秒数

[codeseek.knowledge]
enabled = true                       # 是否启用知识管理功能
injection_max_tokens = 2000          # 知识注入最大 token 数
injection_max_entries = 8            # 知识注入最大条目数
injection_min_score = 0.3            # 知识检索最低得分阈值
injection_rerank = true              # 是否请求 Cross-Encoder 精排（codeseek 端 reranker 未启用时自动降级）

# ── 浏览器配置 ──
[browser]
headless = true                      # 无头模式
browser_path = ""                    # 浏览器可执行文件路径（空=自动查找）
user_data_dir = ""                   # 用户数据目录（空=临时目录）
viewport_width = 1280                # 视口宽度
viewport_height = 720                # 视口高度
timeout_seconds = 120                # 单页操作超时（秒）
task_timeout_seconds = 300           # 单个浏览器任务超时（秒）
max_concurrent_pages = 4             # 最大并发页面数
auto_launch = true                   # 是否自动启动浏览器
idle_timeout = "5m"                  # 空闲超时
allow_no_sandbox = false             # 允许 --no-sandbox 启动（容器环境可能需要）
enable_browser_agent = true          # 总开关：禁用后 Browser-Agent 不可用
# allowed_domains = []               # 允许访问的域名白名单（空=不限制）
# blocked_domains = []               # 禁止访问的域名黑名单
# extra_args = []                    # 附加浏览器启动参数

# ── 关键词词典配置 ──
[keywords]
default_path = "~/.yagent/keywords.txt"  # 默认关键词文件路径
hot_reload = false                   # 是否启用热重载
disable_completion = false           # 禁用关键词自动补全
# [[keywords.dict]]
# name = "custom"                    # 词典名称
# files = ["/path/to/keywords.txt"]  # 关键词文件路径列表
# type = "prefix"                    # 词典类型: "prefix" 或 "exact"
# builtin_type = "default"           # 内置类型: "default" 或 "none"

# ── Git Checkpoint 机制 ──
[git_checkpoint]
enabled = true                       # 总开关
# DEPRECATED: auto_checkpoint / checkpoint_interval 已废弃，
# checkpoint 现在由 agent 通过 git_checkpoint_create 工具在任务里程碑时创建。
auto_checkpoint = false
checkpoint_interval = 0
max_checkpoints = 50                 # 最大保留的 checkpoint 数量
squash_on_exit = true                # Agent 退出时 squash 合并到主分支
generate_commit_message = true       # 使用 LLM 生成 commit 消息
agent_branch_prefix = "agent"        # agent 工作分支前缀
checkpoint_tag_prefix = "checkpoint/coding"  # checkpoint 标签前缀
stash_dirty_worktree = true          # 启动时 stash 未提交的变更
cleanup_agent_branch = true          # 退出时清理 agent 分支
cleanup_checkpoint_tags = true       # 退出时清理 checkpoint 标签
auto_merge_on_exit = false           # 退出时自动 squash-merge（false 则保留分支供人工审查合并）

# ── 增强型 Commander（分布式认知架构）──
[enhanced_commander]
enable = false                       # 总开关
max_delegation_depth = 3             # 最大委派深度
enable_context_compression = false   # 启用上下文压缩（超阈值截断 tool 结果；适用于 Director / Repo / Coding / DevOps）
# context_compression_threshold = 120000  # 触发阈值（token）
# tool_result_keep_tokens = 200        # 截断后保留 token 数

# ── TUI Keybindings Configuration ──
[tui]
  [tui.keybindings]
    [tui.keybindings.edit]
    submit_task     = "alt+s"      # 提交任务
    command_mode    = "ctrl+e"     # 进入命令模式
    toggle_help     = "ctrl+h"     # 切换帮助
    toggle_timeline = "ctrl+l"     # 切换全屏时间线
    page_down       = "ctrl+f"     # 向下翻页
    page_up         = "ctrl+b"     # 向上翻页
    quit            = "ctrl+c"     # 退出
    switch_model    = "alt+m"      # 切换模型
    # ── 多会话 Tab 快捷键 ──
    new_tab         = "ctrl+t"     # 新建会话 tab
    prev_tab        = "alt+["      # 上一个 tab
    next_tab        = "alt+]"      # 下一个 tab
    clear_session   = "alt+c"      # 清空当前会话
    close_tab       = "alt+w"      # 关闭当前 tab
    # alt+1..9 直达第 N 个 tab
    # tab_1 = "alt+1"
    # tab_2 = "alt+2"
    # tab_3 = "alt+3"
    # tab_4 = "alt+4"
    # tab_5 = "alt+5"
    # tab_6 = "alt+6"
    # tab_7 = "alt+7"
    # tab_8 = "alt+8"
    # tab_9 = "alt+9"

    [tui.keybindings.command]
    scroll_down       = "j"        # 向下滚动一行
    scroll_up         = "k"        # 向上滚动一行
    page_down         = "f"        # 向下翻页
    page_up           = "b"        # 向上翻页
    edit_mode         = "i"        # 进入编辑模式
    toggle_help       = "?"        # 显示帮助
    toggle_token_panel = "alt+t"   # 切换 Token 面板
    switch_model      = "alt+m"    # 切换模型
    quit              = "ctrl+c"   # 退出
