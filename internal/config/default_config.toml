# ═══════════════════════════════════════════════════════════════
# Yagent 默认配置模板
# 首次运行自动生成，编辑此文件后生效
# 完整配置说明：https://github.com/yagent/yagent
# ═══════════════════════════════════════════════════════════════

# ── 全局 LLM ──
[global.llm]
use_provider = "deepseek_v4_pro"

[global.llm.providers.aliyun]
model = "qwen3-coder-plus"
temperature = 0.0
max_tokens = 28000
# 模型上下文窗口大小（如 200000），用于 TUI 上下文用量展示，0/未配置则不显示进度条
# context_window = 1000000
api_base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = "your-key"

# 故障转移配置示例（取消注释以启用）:
# 简写格式（按声明顺序尝试）:
# fallback_providers = ["deepseek_v4_pro", "local"]
# 完整格式（按权重排序，weight 越大越优先）:
# fallback_providers = [
#     { provider = "deepseek_v4_pro", weight = 10 },
#     { provider = "local", weight = 5 },
# ]

[global.llm.providers.deepseek_v4_pro]
model = "deepseek-v4-pro"
temperature = 0.0
max_tokens = 3000
api_base_url = "https://api.deepseek.com/v1"
api_key = "your-key"
reasoning_effort = "max"

[global.llm.providers.local]
model = "Qwen3-30B-A3B"
temperature = 0.0
max_tokens = 3000
api_base_url = "http://127.0.0.1:8000"
api_key = "dummy-key"

# ── Agent 级 LLM（优先级: agent > agents > global）──
[agents.llm.director]
use_provider = "deepseek_v4_pro"

[agents.llm.coding]
use_provider = "local"

[agents.llm.repo]
use_provider = "local"

[agents.llm.browser]
use_provider = "local"

[agents.llm.chat]
use_provider = "local"

[agents.llm.meta]
use_provider = "local"

[agents.llm.devops]
use_provider = "local"

# ── 工具级 LLM（优先级: tool > tools > agent > global）──
[tools.llm.thinking]
use_provider = "deepseek_v4_pro"

[tools.llm.deepthinking]
use_provider = "deepseek_v4_pro"

# ── 应用设置 ──
[app]
enable_streaming = true

# ── CodeSeek MCP 代码分析引擎配置 ──
[codeseek]
# codeseek 二进制文件路径（空=不启用 MCP）
binary_path = ""
# MCP 启动参数
mcp_args = ["serve", "--mcp"]
# 请求超时秒数
request_timeout = 30

[codeseek.knowledge]
# 是否启用知识管理功能
enabled = true
# 知识注入最大 token 数
injection_max_tokens = 2000
# 知识注入最大条目数
injection_max_entries = 8
# 知识检索最低得分阈值
injection_min_score = 0.3
# 是否请求 Cross-Encoder 精排（codeseek 端 reranker 未启用时自动降级）
injection_rerank = true

# ── 增强型 Commander（分布式认知架构）──
# 所有选项默认关闭，启用时需显式设置
# 注意：enable_context_compression 压缩 tool 执行结果，适用于 Director / Repo / Coding / DevOps
# [enhanced_commander]
# enable = false
# max_delegation_depth = 3
# enable_context_compression = false
# 压缩阈值回退值：模型收录于内嵌 models.json 时按「上下文窗口 / 3」自动推导，此项被忽略
# context_compression_threshold = 120000
# tool_result_keep_tokens = 200

# ── Git Checkpoint 机制 ──
# 在 Agent 执行期间自动创建代码快照，支持回滚和最终 squash merge
[git_checkpoint]
enabled = true
# DEPRECATED: auto_checkpoint is no longer used.
# Checkpoints are now created by the agent via git_checkpoint_create tool
# when it determines a meaningful milestone has been reached.
auto_checkpoint = false
# DEPRECATED: checkpoint_interval is no longer used.
# The agent decides when to create checkpoints based on task context.
checkpoint_interval = 0
max_checkpoints = 50                     # 最大保留的 checkpoint 数量
squash_on_exit = true                    # Agent 退出时 squash 合并到主分支
generate_commit_message = true           # 使用 LLM 生成 commit 消息
agent_branch_prefix = "agent"     # agent 工作分支前缀
checkpoint_tag_prefix = "checkpoint/coding"  # checkpoint 标签前缀
stash_dirty_worktree = true              # 启动时 stash 未提交的变更
cleanup_agent_branch = true              # 退出时清理 agent 分支
cleanup_checkpoint_tags = true           # 退出时清理 checkpoint 标签
# Whether to automatically squash-merge the agent branch into the user
# branch when the agent exits. When false (default), the agent branch is
# preserved with all commits squashed into one, allowing the user to
# review and merge manually.
auto_merge_on_exit = false

# ═══════════════════════════════════════════════════════════════
# 上下文压缩配置（三层防御的第一层：TOML 配置层）
# ═══════════════════════════════════════════════════════════════
# 如果此段完全缺失，应用层（compact_config.go）会通过 applySafeDefaults()
# 兜底所有字段的默认值。建议显式配置以下字段：
[context]
enable_auto_compact = true            # 是否自动触发压缩（默认 true）
max_context_tokens = 198000           # 最大上下文 token 数
summarization_model = ""              # 轻量摘要模型（空=复用主引擎）
summarization_provider = ""           # 独立摘要 provider（空=复用主引擎）
summarization_timeout = 120           # 摘要超时（秒）
summarization_max_input_tokens = 120000 # 单批次最大输入 token 数
summarization_prompt = ""             # 自定义摘要提示词（空=使用默认）
keep_recent_rounds = 2                # 始终保留的最近对话轮数

# ═══════════════════════════════════════════════════════════════
# TUI Keybindings Configuration
# ── 可配置 TUI 快捷键 ──
# 未配置的项使用 Go 代码中的默认值。
# 格式：使用 Bubble Tea 按键事件格式（小写）：
#   - 修饰键: "ctrl+e", "alt+s", "alt+enter"
#   - 单键:   "j", "k", "f", "b", "i", "?"
#   - 特殊键: "enter", "esc", "tab", "space"

[tui]
  [tui.keybindings]
    
    [tui.keybindings.edit]
    submit_task     = "alt+s"      # 提交任务
    command_mode    = "ctrl+e"     # 进入命令模式
    toggle_help     = "ctrl+h"     # 切换帮助
    toggle_timeline = "ctrl+l"     # 切换全屏时间线
    page_down       = "ctrl+f"     # 向下翻页
    page_up         = "ctrl+b"     # 向上翻页
    quit            = "ctrl+c"     # 退出
    switch_model    = "alt+m"      # 切换模型
    
    [tui.keybindings.command]
    scroll_down       = "j"        # 向下滚动一行
    scroll_up         = "k"        # 向上滚动一行
    page_down         = "f"        # 向下翻页
    page_up           = "b"        # 向上翻页
    edit_mode         = "i"        # 进入编辑模式
    toggle_help       = "?"        # 显示帮助
    toggle_token_panel = "alt+t"   # 切换 Token 面板
    switch_model      = "alt+m"    # 切换模型
    quit              = "ctrl+c"   # 退出

# ── LLM 故障转移配置 ──
[llm]
# enable_fallback = true       # 启用provider级故障转移
# fallback_max_retries = 2     # fallback provider的内部重试次数
